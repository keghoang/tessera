<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tessera Dashboard</title>
<style>
:root{
  --bg:#f5f5f7;--panel:#ffffff;--line:rgba(0,0,0,.08);--text:#1d1d1f;--sub:#6e6e73;--faint:#a1a1a6;
  --accent:#0a84ff;--hover:rgba(0,0,0,.045);--sel:rgba(10,132,255,.13);--raised:#f2f2f5;
  --working:#30a46c;--waiting:#f5a524;--farm:#3b82f6;--idle:#a1a1a6;
  --r:12px;--inset:16px;--shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#161617;--panel:#1f1f21;--line:rgba(255,255,255,.09);--text:#f5f5f7;--sub:#a1a1a6;--faint:#6e6e73;
  --hover:rgba(255,255,255,.06);--sel:rgba(10,132,255,.22);--raised:#29292c;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/20px -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
input{font:inherit;color:inherit}
.sub{color:var(--sub)}.faint{color:var(--faint)}.num{font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.working{background:var(--working)}.dot.waiting{background:var(--waiting)}.dot.farm{background:var(--farm)}.dot.idle{background:var(--idle)}

.page{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;max-width:1280px;margin:0 auto;padding:24px 28px 80px}

/* people: one colour each; an agent is a squared, outlined tag in its owner's colour */
.person{--p:var(--faint);display:inline-flex;align-items:center;gap:6px;max-width:100%;font-size:12px;line-height:18px;font-weight:500;padding:1px 9px;border-radius:999px;
  background:color-mix(in srgb,var(--p) 22%,transparent);color:color-mix(in srgb,var(--p) 55%,var(--text));white-space:nowrap}
.person span{overflow:hidden;text-overflow:ellipsis}
.person.agent{border-radius:5px;padding:0 7px;border:1px solid color-mix(in srgb,var(--p) 55%,transparent);background:color-mix(in srgb,var(--p) 12%,transparent)}
.person.agent i{width:6px;height:6px;background:var(--p);transform:rotate(45deg);flex:none}
.swatch{width:8px;height:8px;border-radius:50%;background:var(--p);flex:none}

/* the project outline: every row shares one left edge */
.outline{position:sticky;top:24px;align-self:start;max-height:calc(100vh - 48px);overflow:auto}
.proj{font-size:20px;line-height:24px;font-weight:700;letter-spacing:-.02em;padding:0 10px}
.read{font-size:11.5px;color:var(--faint);padding:4px 10px 0}
.outline .kind{font-size:11.5px;font-weight:600;color:var(--faint);margin-top:18px}
.outline button{display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 10px;border-radius:8px;font-weight:500}
.outline button:hover{background:var(--hover)}
.outline button[aria-current=true]{background:var(--sel)}
.outline .c{margin-left:auto;color:var(--sub);font-size:12.5px;font-weight:400}
.outline .all{margin-top:14px}

/* top bar: search left, filters right, on one 36px line */
.bar{display:flex;align-items:center;gap:8px;height:36px}
.search{display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:10px;height:36px;padding:0 12px;width:300px;box-shadow:var(--shadow)}
.search input{border:0;outline:0;background:none;width:100%}
.search:focus-within{box-shadow:0 0 0 3px var(--sel)}
.bar .space{flex:1}
.pill{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px;border-radius:999px;font-size:12.5px;font-weight:500;background:var(--panel);box-shadow:var(--shadow);white-space:nowrap}
.pill[aria-pressed=true]{background:var(--accent);color:#fff}
.pill.none{opacity:.5}
.people{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:14px;padding-left:calc(var(--inset) - 10px)}
.people button{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:500}
.people button:hover{background:var(--hover)}
.people button[aria-pressed=true]{background:var(--panel);box-shadow:var(--shadow)}

/* headings sit on the same inset as the text inside the cards */
h2{font-size:22px;line-height:28px;font-weight:700;letter-spacing:-.02em;margin:26px 0 0;padding-left:var(--inset)}
.blockhead{display:flex;align-items:baseline;gap:8px;margin:16px 0 8px;padding-left:var(--inset)}
.blockhead h3{font-size:15px;font-weight:650;margin:0}
.card{background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}

/* one column template for every group, so columns line up down the whole page */
.grid{display:grid;grid-template-columns:var(--cols)}
.head{display:contents}
.head>div{font-size:11px;line-height:16px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:600;padding:12px 0 4px 18px}
.head>div:first-child{padding-left:var(--inset)}
.item{display:contents}
.item>div{border-top:1px solid var(--line);padding:6px 0 6px 6px;min-width:0}
.item>div:last-child{padding-right:6px}
/* the name sits on the same line as the version inside the tiles: 6 + 10 down */
.item .name{font-size:15px;line-height:24px;font-weight:650;letter-spacing:-.01em;padding:16px 12px 16px var(--inset)}

/* a task tile. Three levels: the version, who saved it and when, then what is happening now. */
.tile{display:block;width:100%;border-radius:10px;padding:10px 12px}
button.tile{transition:background .12s}
button.tile:hover{background:color-mix(in srgb,var(--text) 8%,transparent)}
button.tile.live:hover{background:color-mix(in srgb,var(--c) 15%,transparent)}
button.tile[aria-expanded=true]{box-shadow:inset 0 0 0 2px var(--accent)}
.tile.has{background:color-mix(in srgb,var(--text) 4%,transparent)}
.tile.live{background:color-mix(in srgb,var(--c) 9%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 32%,transparent)}
.tile.dim{opacity:.35}
.tile.none{color:var(--faint);line-height:24px}
.tile .l1{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px 10px;min-width:0;min-height:24px}
.tile .v{font-size:16px;line-height:24px;font-weight:650;letter-spacing:-.01em}
.tile .v.no{font-size:13px;font-weight:500;color:var(--sub);letter-spacing:0}
.tile .l1 .age{white-space:nowrap}
.tile .l2{display:flex;margin-top:6px;min-width:0}
.tile .l2 .person{min-width:0}
.tile .meta{font-size:12px;line-height:16px;color:var(--faint);margin-top:2px}
.now{margin-top:10px;padding-top:10px;border-top:1px solid color-mix(in srgb,var(--c) 24%,var(--line))}
.now .st{display:flex;align-items:center;gap:6px;min-width:0;height:18px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:color-mix(in srgb,var(--c) 72%,var(--text))}
.now .st .t{font-weight:500;letter-spacing:0;text-transform:none;color:var(--sub);font-size:12px}
.now .st .t::before{content:"\00b7";margin-right:6px;color:var(--faint)}
.now .st .person{margin-left:auto;flex:0 1 auto;min-width:0;text-transform:none;letter-spacing:0}
.now .doing{font-size:13px;line-height:18px;margin-top:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.age{color:var(--faint);font-size:12px}

/* the detail of one task: a popover that floats over the page and points at the tile that was clicked */
.pop{position:absolute;z-index:20;width:min(460px,calc(100vw - 32px));filter:drop-shadow(0 12px 32px rgba(0,0,0,.35)) drop-shadow(0 0 1px rgba(0,0,0,.4))}
.pop .arrow{position:absolute;width:16px;height:16px;transform:rotate(45deg);background:var(--raised);border-radius:3px}
.pop.below .arrow{top:-7px}.pop.above .arrow{bottom:-7px}
.panelbox{position:relative;border-radius:14px;background:var(--raised);padding:16px 18px 18px;max-height:min(560px,calc(100vh - 48px));overflow:auto}
.panelbox .phead{display:flex;align-items:center;gap:8px;font-size:11px;line-height:16px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;color:var(--sub)}
.panelbox .phead b{color:var(--text);font-weight:700}
.panelbox .close{margin-left:auto;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--sub);font-size:14px;letter-spacing:0}
.panelbox .close:hover{background:var(--hover);color:var(--text)}
.panelbox .now{margin-top:12px;padding:10px 12px;border-top:0;border-radius:10px;background:color-mix(in srgb,var(--c) 10%,transparent)}
.panelbox .now .doing{-webkit-line-clamp:unset}
.panelbox .latest{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.panelbox .latest .v{font-size:20px;line-height:26px;font-weight:700;letter-spacing:-.02em}
.panelbox .req{margin:8px 0 0;font-size:14px;line-height:21px;max-width:720px}
.panelbox ul{margin:8px 0 0;padding-left:18px;color:var(--sub);max-width:720px}
.panelbox li{margin-top:3px}
.panelbox .none{margin-top:8px;color:var(--faint);font-size:12.5px}
.panelbox .earlier{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.panelbox .earlier .lab{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;color:var(--faint);margin-bottom:6px}
.panelbox .earlier .e{display:flex;align-items:center;gap:10px;height:26px;font-size:13px}
.panelbox .earlier .e .v{font-weight:600;min-width:44px}
.panelbox .earlier .e .age{min-width:130px}
.nothing{padding:14px var(--inset);color:var(--faint)}
@media (max-width:860px){.page{grid-template-columns:1fr}.outline{position:static;max-height:none}}
</style>
</head>
<body>
<div class="page" id="app"></div>
<script>
(async function () {
  const name = (location.hash.slice(1).split("/")[0] || "sample").replace(/[^A-Za-z0-9_-]/g, "") || "sample";
  const d = await fetch("data/" + name + ".json", { cache: "no-store" }).then((r) => r.json());
  const now = new Date(d.now.replace(" ", "T"));
  const age = (s) => {
    if (!s) return "";
    const m = Math.max(0, Math.round((now - new Date(s.replace(" ", "T"))) / 60000));
    return m < 1 ? "now" : m < 60 ? m + " min" : m < 1440 ? Math.round(m / 60) + " h" : Math.round(m / 1440) + " d";
  };
  // When something was saved: "38 min ago" or "3 h ago" within a day, the exact date and time after that.
  const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const when = (s) => {
    if (!s) return "";
    const at = new Date(s.replace(" ", "T")), m = Math.max(0, Math.round((now - at) / 60000));
    if (m < 1) return "just now";
    if (m < 60) return m + " min ago";
    if (m < 1440) return Math.round(m / 60) + " h ago";
    const h = at.getHours(), mm = String(at.getMinutes()).padStart(2, "0");
    return MONTHS[at.getMonth()] + " " + at.getDate() + (at.getFullYear() !== now.getFullYear() ? " " + at.getFullYear() : "") + ", " + (h % 12 || 12) + ":" + mm + (h < 12 ? " AM" : " PM");
  };
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const vnum = (n) => "v" + String(n).padStart(3, "0");
  const low = (s) => String(s || "").toLowerCase();
  const STATE = { waiting: "Need you", working: "Working", farm: "On the farm" };

  // One colour per person, never repeated within a job, on the part of the wheel the states don't use.
  const people = d.people.map(low);
  const SLOT = [0, 4, 2, 6, 1, 5, 3, 7], TIER = [[72, 62], [58, 78], [62, 45]];
  const colourOf = (person) => {
    const i = people.indexOf(low(person));
    if (i < 0) return "";
    const round = Math.floor(i / 8);
    const at = ((SLOT[i % 8] + (round % 2) * 0.5) * 31.25 + round * 3.7) % 250;
    const hue = at < 95 ? 60 + at : (230 + (at - 95)) % 360;
    const [s, l] = TIER[round % 3];
    return "hsl(" + hue.toFixed(1) + " " + s + "% " + l + "%)";
  };
  const short = (agent) => (agent === "Claude Code" ? "Claude" : agent);
  const actor = (person, agent) => {
    const c = colourOf(person), st = c ? ` style="--p:${c}"` : "";
    return agent ? `<span class="person agent"${st}><i></i><span>${esc(person)}'s ${esc(short(agent))}</span></span>`
                 : `<span class="person"${st}><span>${esc(person)}</span></span>`;
  };
  const agentOf = (v) => (v.made_by === "agent" ? v.agent || "agent" : "");

  const versionsOf = (item) => d.versions.filter((v) => v.shot === item).sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const liveOf = (item) => d.live.filter((l) => l.shot === item);
  const count = {};
  d.live.forEach((l) => (count[l.state] = (count[l.state] || 0) + 1));
  const kinds = ["Shots", "Assets"].filter((k) => d.structure.some((b) => b.kind === k));
  const blocksOf = (k) => d.structure.filter((b) => b.kind === k);
  const key = (b) => b.kind + "/" + b.name;
  const tasksOf = (b) => (b.tasks && b.tasks.length ? b.tasks : [...new Set(d.versions.filter((v) => b.items.includes(v.shot)).map((v) => v.task))]);
  const NCOL = Math.max(1, ...d.structure.map((b) => tasksOf(b).length));
  const NAMECOL = 190;
  let q = "", open = "", only = "", group = "", person = "";
  // what the viewer had open survives the page redrawing itself when the job changes
  try { const s = JSON.parse(sessionStorage.getItem("view:" + name) || "{}"); q = s.q || ""; open = s.open || ""; only = s.only || ""; group = s.group || ""; person = s.person || ""; } catch (e) {}
  // index.html#<job>/<item>|<task> opens that task's detail
  { const want = decodeURIComponent(location.hash.slice(1).split("/").slice(1).join("/")); if (want.includes("|")) open = want; }
  const remember = () => { try { sessionStorage.setItem("view:" + name, JSON.stringify({ q, open, only, group, person, y: window.scrollY })); } catch (e) {} };

  const involves = (item, p) => versionsOf(item).some((v) => low(v.artist) === p) || liveOf(item).some((l) => low(l.person) === p);
  const shown = (item) => {
    if (only && !liveOf(item).some((l) => l.state === only)) return false;
    if (person && !involves(item, person)) return false;
    if (!q) return true;
    return low(item + " " + versionsOf(item).map((v) => v.artist + " " + v.task).join(" ") + " " + liveOf(item).map((l) => l.person).join(" ")).includes(q);
  };

  // What is happening on a task right now: the state and for how long, then the one line of what.
  const LABEL = { waiting: "Needs you", working: "Working", farm: "On the farm", idle: "Idle" };
  const status = (l, tag) => `<div class="now" style="--c:var(--${l.state})"><div class="st"><span class="dot ${l.state}"></span>${LABEL[l.state] || esc(l.state)}<span class="t num">${when(l.updated).replace(" ago", "")}</span>${tag || ""}</div><div class="doing">${esc(l.doing)}</div></div>`;

  // The detail of one task of one shot or asset. `at` is where its tile sits across the task columns (0 to 1).
  const detail = (item, task) => {
    const v = versionsOf(item).find((x) => x.task === task), l = liveOf(item).find((x) => x.task === task);
    const latest = v ? `<div class="latest"><span class="v num">${vnum(v.version)}</span><span class="age num">${when(v.date)}</span>${actor(v.artist, agentOf(v))}</div>
      ${v.request ? `<p class="req">${esc(v.request)}</p>` : ""}
      ${v.changes && v.changes.length ? `<ul>${v.changes.map((c) => `<li>${esc(c)}</li>`).join("")}</ul>` : ""}
      ${v.has_trail ? "" : `<div class="none">No notes were recorded with this version.</div>`}` : `<div class="none">No version saved yet.</div>`;
    const earlier = v && v.history && v.history.length ? `<div class="earlier"><div class="lab">Earlier versions</div>${v.history.map((h) =>
      `<div class="e"><span class="v num">${vnum(h.version)}</span><span class="age num">${when(h.date)}</span>${actor(h.artist, h.made_by === "agent" ? h.agent || "agent" : "")}</div>`).join("")}</div>` : "";
    return `<span class="arrow"></span><div class="panelbox">
      <div class="phead"><b>${esc(item)}</b><span>${esc(task)}</span><button class="close" data-open="${esc(item + "|" + task)}" aria-label="Close">✕</button></div>
      ${l ? status(l) : ""}${latest}${earlier}</div>`;
  };

  const block = (b) => {
    const list = b.items.filter(shown);
    if (!list.length) return "";
    const tasks = tasksOf(b), pad = Array(NCOL - tasks.length).fill("<div></div>").join("");
    const rows = list.map((item) => {
      const vs = versionsOf(item), lv = liveOf(item);
      const cells = tasks.map((t) => {
        const v = vs.find((x) => x.task === t), l = lv.find((x) => x.task === t);
        if (!v && !l) return `<div><div class="tile none">–</div></div>`;
        const dim = person && !((v && low(v.artist) === person) || (l && low(l.person) === person)) ? " dim" : "";
        // the agent's tag goes on the version line when it saved that version, else beside its status
        const sameActor = v && l && agentOf(v) && low(v.artist) === low(l.person);
        const top = v ? `<div class="l1"><span class="v num">${vnum(v.version)}</span><span class="age num">${when(v.date)}</span></div><div class="l2">${actor(v.artist, agentOf(v))}</div>`
                      : `<div class="l1"><span class="v no">No version yet</span></div><div class="l2">${actor(l.person, l.agent)}</div>`;
        const id = item + "|" + t;
        return `<div><button class="tile has${l ? " live" : ""}${dim}" data-open="${esc(id)}" aria-expanded="${open === id}"${l ? ` style="--c:var(--${l.state})"` : ""}>${top}${l ? status(l, v && !sameActor ? actor(l.person, l.agent) : "") : ""}</button></div>`;
      }).join("");
      return `<div class="item"><div class="name">${esc(item)}</div>${cells}${pad}</div>`;
    }).join("");
    return `<div class="blockhead"><h3>${esc(b.name)}</h3><span class="faint num">${list.length}${list.length !== b.items.length ? " of " + b.items.length : ""}</span></div>
      <div class="card"><div class="grid"><div class="head"><div>${b.kind === "Shots" ? "Shot" : "Asset"}</div>${tasks.map((t) => `<div>${esc(t)}</div>`).join("")}${pad}</div>${rows}</div></div>`;
  };

  function draw(keepFocus) {
    const total = d.structure.reduce((n, b) => n + b.items.length, 0);
    const outline = `<button class="all" data-group="" aria-current="${group === ""}">Everything<span class="c num">${total}</span></button>` + kinds.map((k) =>
      `<button class="kind" data-group="${k}" aria-current="${group === k}">${k}<span class="c num">${blocksOf(k).reduce((n, b) => n + b.items.length, 0)}</span></button>` +
      blocksOf(k).map((b) => {
        const st = ["waiting", "working", "farm"].find((s) => b.items.some((i) => liveOf(i).some((l) => l.state === s)));
        return `<button data-group="${esc(key(b))}" aria-current="${group === key(b)}">${esc(b.name)}${st ? `<span class="dot ${st}"></span>` : ""}<span class="c num">${b.items.length}</span></button>`;
      }).join("")).join("");
    const pills = Object.keys(STATE).map((s) => `<button class="pill ${count[s] ? "" : "none"}" data-only="${s}" aria-pressed="${only === s}"><span class="dot ${s}"></span>${count[s] || 0} ${STATE[s].toLowerCase()}</button>`).join("");
    const who = `<div class="people"><button data-person="" aria-pressed="${person === ""}">Everyone</button>${d.people.map((p) =>
      `<button data-person="${esc(low(p))}" aria-pressed="${person === low(p)}"><span class="swatch" style="--p:${colourOf(p)}"></span>${esc(p)}</button>`).join("")}</div>`;
    const body = kinds.map((k) => {
      const blocks = blocksOf(k).filter((b) => !group || group === k || group === key(b)).map(block).join("");
      return blocks ? `<h2>${k}</h2>${blocks}` : "";
    }).join("");
    const app = document.getElementById("app");
    app.style.setProperty("--cols", `${NAMECOL}px repeat(${NCOL},minmax(0,1fr))`);
    app.style.setProperty("--namecol", NAMECOL + "px");
    app.innerHTML = `<aside class="outline"><div class="proj">${esc(d.job).replace(/([_-])/g, "$1<wbr>")}</div><div class="read">Read ${esc(d.collected)}${d.sample ? " · sample data" : ""}</div>${outline}</aside>
      <main><div class="bar"><label class="search"><span class="faint">⌕</span><input id="q" placeholder="Search shots, assets, people" value="${esc(q)}"></label><span class="space"></span>${pills}</div>${who}
      ${body || `<div class="card nothing" style="margin-top:20px">Nothing matches.</div>`}</main>`;
    if (keepFocus) { const i = document.getElementById("q"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
    place();
  }
  // The popover sits under its tile, or above it when there is no room below, and never leaves the window.
  function place() {
    let pop = document.getElementById("pop");
    const tile = open && [...document.querySelectorAll("button.tile")].find((b) => b.dataset.open === open);
    if (!tile) { if (pop) pop.remove(); if (open) open = ""; return; }
    if (!pop) { pop = document.createElement("div"); pop.id = "pop"; document.body.append(pop); }
    const cut = open.indexOf("|");
    pop.className = "pop below";
    pop.innerHTML = detail(open.slice(0, cut), open.slice(cut + 1));
    const r = tile.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight, gap = 10;
    const below = r.bottom + gap + h <= window.innerHeight || r.top - gap - h < 0;
    const left = Math.max(16, Math.min(r.left, window.innerWidth - w - 16));
    pop.className = "pop " + (below ? "below" : "above");
    pop.style.left = left + window.scrollX + "px";
    pop.style.top = (below ? r.bottom + gap : r.top - gap - h) + window.scrollY + "px";
    pop.querySelector(".arrow").style.left = Math.max(18, Math.min(r.left + Math.min(r.width / 2, 40) - left - 8, w - 34)) + "px";
  }
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && open) { open = ""; draw(); remember(); } });
  window.addEventListener("resize", place);
  document.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    // a click anywhere outside the popover closes it
    if (!b) { if (open && !e.target.closest("#pop")) { open = ""; draw(); remember(); } return; }
    if ("only" in b.dataset) only = only === b.dataset.only ? "" : b.dataset.only;
    else if ("group" in b.dataset) { group = b.dataset.group; window.scrollTo({ top: 0 }); }
    else if ("person" in b.dataset) person = b.dataset.person;
    else if ("open" in b.dataset) open = open === b.dataset.open ? "" : b.dataset.open;
    else return;
    draw(); remember();
  });
  document.addEventListener("input", (e) => { if (e.target.id === "q") { q = e.target.value.trim().toLowerCase(); draw(true); remember(); } });
  draw();
  try { window.scrollTo(0, JSON.parse(sessionStorage.getItem("view:" + name) || "{}").y || 0); } catch (e) {}
  // The job is read again every minute (main.py). Redraw when what it found has changed.
  const print = (x) => JSON.stringify(Object.assign({}, x, { collected: 0, now: 0 }));
  const shownData = print(d);
  if (!d.sample) setInterval(() => fetch("data/" + name + ".json", { cache: "no-store" }).then((r) => r.json())
    .then((x) => { if (print(x) !== shownData && document.activeElement.id !== "q") { remember(); location.reload(); } }).catch(() => {}), 30000);
})();
</script>
